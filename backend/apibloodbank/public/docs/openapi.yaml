openapi: 3.0.3
info:
  title: 'API BloodBank - Documentation'
  description: 'API complète pour la gestion des dons de sang, banques de sang, urgences et géolocalisation.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentification
    description: "\nAPIs pour la gestion de l'authentification des utilisateurs"
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Vous pouvez obtenir votre clé d'authentification en vous connectant via l'endpoint /api/auth/login"
security:
  -
    default: []
paths:
  /api/auth/register:
    post:
      summary: "Inscription d'un nouvel utilisateur"
      operationId: inscriptionDunNouvelUtilisateur
      description: "Permet à un utilisateur de s'inscrire sur la plateforme avec un rôle spécifique."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Utilisateur créé avec succès'
                  user:
                    id: 1
                    name: 'Jean Dupont'
                    email: jean.dupont@example.com
                    phone: '+33123456789'
                    role:
                      id: 2
                      name: donor
                    blood_type:
                      id: 1
                      name: A+
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Utilisateur créé avec succès'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jean Dupont'
                      email:
                        type: string
                        example: jean.dupont@example.com
                      phone:
                        type: string
                        example: '+33123456789'
                      role:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: donor
                      blood_type:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: A+
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Erreur de validation'
                  errors:
                    email:
                      - "L'adresse email est déjà utilisée."
                properties:
                  message:
                    type: string
                    example: 'Erreur de validation'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - "L'adresse email est déjà utilisée."
                        items:
                          type: string
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Le nom complet de l'utilisateur."
                  example: 'Jean Dupont'
                  nullable: false
                email:
                  type: string
                  description: "L'adresse email unique."
                  example: jean.dupont@example.com
                  nullable: false
                password:
                  type: string
                  description: 'Le mot de passe (minimum 8 caractères).'
                  example: password123
                  nullable: false
                phone:
                  type: string
                  description: 'Le numéro de téléphone.'
                  example: '+33123456789'
                  nullable: true
                address:
                  type: string
                  description: "L'adresse postale."
                  example: '123 Rue de la Paix'
                  nullable: true
                city:
                  type: string
                  description: 'La ville.'
                  example: Paris
                  nullable: true
                postal_code:
                  type: string
                  description: 'Le code postal.'
                  example: '75001'
                  nullable: true
                blood_type_id:
                  type: integer
                  description: "L'ID du groupe sanguin."
                  example: 1
                  nullable: true
                date_of_birth:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-07-06T18:32:50'
                  nullable: true
                gender:
                  type: string
                  description: ''
                  example: male
                  nullable: true
                  enum:
                    - male
                    - female
                    - other
                role:
                  type: string
                  description: "Le rôle de l'utilisateur (donor, doctor, blood_bank, admin)."
                  example: donor
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'La confirmation du mot de passe.'
                  example: password123
                  nullable: false
                country:
                  type: string
                  description: 'Le pays.'
                  example: France
                  nullable: false
                latitude:
                  type: number
                  description: 'La latitude (pour la géolocalisation).'
                  example: 48.8566
                  nullable: false
                longitude:
                  type: number
                  description: 'La longitude (pour la géolocalisation).'
                  example: 2.3522
                  nullable: false
              required:
                - name
                - email
                - password
                - role
                - password_confirmation
      security: []
  /api/auth/login:
    post:
      summary: 'Connexion utilisateur'
      operationId: connexionUtilisateur
      description: "Authentifie un utilisateur et retourne un token d'accès."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Connexion réussie'
                  user:
                    id: 1
                    name: 'Jean Dupont'
                    email: jean.dupont@example.com
                    role:
                      name: donor
                  token: 1|abc123def456...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Connexion réussie'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jean Dupont'
                      email:
                        type: string
                        example: jean.dupont@example.com
                      role:
                        type: object
                        properties:
                          name:
                            type: string
                            example: donor
                  token:
                    type: string
                    example: 1|abc123def456...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Identifiants invalides'
                properties:
                  message:
                    type: string
                    example: 'Identifiants invalides'
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "L'adresse email."
                  example: jean.dupont@example.com
                  nullable: false
                password:
                  type: string
                  description: 'Le mot de passe.'
                  example: password123
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: 'Déconnexion utilisateur'
      operationId: dconnexionUtilisateur
      description: "Invalide le token d'accès de l'utilisateur connecté."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Déconnexion réussie'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Déconnexion réussie'
      tags:
        - Authentification
  /api/auth/me:
    get:
      summary: 'Profil utilisateur connecté'
      operationId: profilUtilisateurConnect
      description: "Récupère les informations du profil de l'utilisateur connecté."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  user:
                    id: 1
                    name: 'Jean Dupont'
                    email: jean.dupont@example.com
                    phone: '+33123456789'
                    role:
                      name: donor
                    blood_type:
                      name: A+
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jean Dupont'
                      email:
                        type: string
                        example: jean.dupont@example.com
                      phone:
                        type: string
                        example: '+33123456789'
                      role:
                        type: object
                        properties:
                          name:
                            type: string
                            example: donor
                      blood_type:
                        type: object
                        properties:
                          name:
                            type: string
                            example: A+
      tags:
        - Authentification
  /api/auth/refresh:
    post:
      summary: 'Rafraîchir le token'
      operationId: rafrachirLeToken
      description: "Génère un nouveau token d'accès pour l'utilisateur connecté."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  token: 2|xyz789abc123...
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: 2|xyz789abc123...
      tags:
        - Authentification
  /api/blood-types:
